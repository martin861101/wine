services:
  postgres:
    image: postgres:16-alpine
    container_name: wine-local-postgres
    environment:
      POSTGRES_DB: wine_chapters
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine_local_dev
    ports:
      - "55432:5432"
    volumes:
      - wine_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_chapters"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wine_local_postgres_data:
