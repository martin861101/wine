<!doctype html>
<html>
  <body style="margin: 0; background: #f8f1ea; font-family: Arial, sans-serif; color: #513d43">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 28px 14px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 620px;
              background: #fffaf6;
              border: 1px solid #eadbd2;
              border-radius: 24px;
              overflow: hidden;
            "
          >
            <tr>
              <td align="center" style="background: #5d2434; padding: 28px">
                <img
                  src="{{ .SiteURL }}/img/wine-chapters-logo.png"
                  width="92"
                  alt="Wine &amp; Chapters"
                />
                <div
                  style="
                    margin-top: 12px;
                    color: #f8e9df;
                    font:
                      20px Georgia,
                      serif;
                  "
                >
                  Wine &amp; Chapters
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 38px 34px">
                <h1
                  style="
                    font:
                      30px Georgia,
                      serif;
                    color: #5d2434;
                  "
                >
                  Confirm your email
                </h1>
                <p style="font-size: 16px; line-height: 1.7">
                  Welcome to the beginning of a lovely new chapter. Confirm your email address so
                  the committee can review your membership.
                </p>
                <p style="margin: 30px 0">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background: #5d2434;
                      color: #fffaf6;
                      text-decoration: none;
                      padding: 14px 24px;
                      border-radius: 999px;
                      font-weight: bold;
                    "
                    >Confirm my email</a
                  >
                </p>
                <p style="font-size: 13px; color: #78656b">
                  If you did not apply, you can safely ignore this note.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px;
                  background: #f1e4dc;
                  text-align: center;
                  font-size: 12px;
                  color: #78656b;
                "
              >
                Books begin the conversation. Community keeps the chapter going.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
